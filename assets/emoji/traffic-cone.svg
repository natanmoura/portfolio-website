<stop stop-color="#FFA24A"/>
<stop offset="0.45" stop-color="#FF7A1A"/>
<stop offset="1" stop-color="#E5530A"/>
</linearGradient>
<linearGradient id="stripe" x1="8" y1="16" x2="24" y2="16" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFFFFF"/>
<stop offset="1" stop-color="#D9D6DE"/>
</linearGradient>
<linearGradient id="base" x1="16" y1="24.5" x2="16" y2="29.5" gradientUnits="userSpaceOnUse">
<stop stop-color="#6A6670"/>
<stop offset="1" stop-color="#3F3B45"/>
</linearGradient>
<clipPath id="body">

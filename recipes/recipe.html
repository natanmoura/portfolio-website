<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Recipe — Moura Boys Forever Recipes</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤤</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Karla:wght@300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add('pf-loading');</script>
  <link rel="stylesheet" href="css/recipes.css?v=14" />
  <style>@view-transition { navigation: auto; }</style>
</head>
<body>

  <div class="wrap">
    <header class="recipe-head">
      <a class="backlink" href="index.html">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 5.5 8 10 3.5"/></svg>
        All recipes
      </a>
      <h1 id="title">…</h1>
      <p class="recipe-meta" id="meta"></p>
      <div class="recipe-bar">
        <div class="servings" id="servings"></div>
        <button class="plan-btn plan-fixed" id="planBtn"></button>
      </div>
    </header>

    <div class="cook-grid" id="cookGrid">
      <aside class="ingredients-panel">
        <div class="ingredients-card" id="ingredients"></div>
      </aside>
      <div class="method">
        <div id="steps"></div>
      </div>
    </div>

    <div class="qr-reveal">
      <button class="qr-reveal-link" id="qrRevealBtn">View QR code — open this recipe on another device</button>
    </div>
  </div>

  <div class="qr-overlay" id="qrOverlay">
    <div class="qr-card">
      <h3 id="qrTitle"></h3>
      <div class="qr-canvas" id="qrCanvas"></div>
      <p class="qr-hint">Scan with a phone camera to open this recipe</p>
      <button class="ghost-btn" id="qrClose">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="js/pagefade.js?v=1"></script>
  <script src="js/recipes-data.js?v=8"></script>
  <script src="js/cook.js?v=5"></script>
</body>
</html>

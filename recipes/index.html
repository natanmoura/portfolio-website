<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Moura Boy Forever Recipes</title>
  <meta name="description" content="A family recipe collection — search it, spin it, and build a grocery list from it." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤤</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Karla:wght@300..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/recipes.css?v=3" />
</head>
<body>

  <div class="wrap">

    <!-- ── Masthead ─────────────────────────────────────── -->
    <header class="masthead">
      <a class="backlink" href="/">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 5.5 8 10 3.5"/></svg>
        natanmoura.com
      </a>
      <h1>The Moura Boy Forever Recipes <span class="drool">🤤</span></h1>
      <p class="masthead-meta" id="mastheadMeta"></p>
    </header>

    <!-- ── Controls ─────────────────────────────────────── -->
    <div class="controls" id="controls">
      <div class="controls-inner">
        <div class="search" id="searchWrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input type="search" id="search" placeholder="Search recipes and ingredients" autocomplete="off" aria-label="Search recipes and ingredients" />
          <button class="search-clear" id="searchClear" aria-label="Clear search">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
          <div class="autofill" id="autofill" role="listbox" aria-label="Matching recipes"></div>
        </div>

        <div class="modes" role="tablist" aria-label="View">
          <span class="mode-ink" id="modeInk"></span>
          <button class="mode-btn" role="tab" id="tab-list" data-view="list" aria-selected="true">List</button>
          <button class="mode-btn" role="tab" id="tab-orbit" data-view="orbit" aria-selected="false">Orbit</button>
          <button class="mode-btn" role="tab" id="tab-plan" data-view="plan" aria-selected="false">Plan<span class="count" id="planCount"></span></button>
        </div>

        <div class="sort" id="sortWrap">
          <select id="sort" aria-label="Sort recipes">
            <option value="az">A–Z</option>
            <option value="za">Z–A</option>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ── List ─────────────────────────────────────────── -->
    <section class="view list is-active" id="view-list" role="tabpanel" aria-labelledby="tab-list">
      <div id="recipeList"></div>
    </section>

    <!-- ── Orbit ────────────────────────────────────────── -->
    <section class="view" id="view-orbit" role="tabpanel" aria-labelledby="tab-orbit">
      <div id="orbitStage">
        <div class="css3d" id="css3d"></div>

        <div class="orbit-tools">
          <button class="orbit-tool" id="diceBtn" aria-label="Pick a random recipe" title="Pick a random recipe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"/>
              <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>

        <div class="orbit-card" id="orbitCard">
          <h3 id="orbitCardTitle"></h3>
          <p id="orbitCardMeta"></p>
          <a class="open-btn" id="orbitCardOpen" href="#">Open recipe</a>
        </div>

        <p class="orbit-hint" id="orbitHint">Drag to spin · tap a bubble to focus</p>
      </div>
      <div class="orbit-fallback" id="orbitFallback">
        <strong>The orbit needs a live connection.</strong>
        <p>The 3D view loads its engine from the web. Use the List tab in the meantime.</p>
      </div>
    </section>

    <!-- ── Meal plan ────────────────────────────────────── -->
    <section class="view plan-view" id="view-plan" role="tabpanel" aria-labelledby="tab-plan">
      <div class="plan-grid">

        <div class="panel">
          <h2>This week</h2>
          <p class="panel-sub" id="chosenSub">Nothing picked yet</p>
          <div class="chosen-list" id="chosenList"></div>
        </div>

        <div class="panel">
          <div class="grocery-head">
            <div>
              <h2>Grocery list</h2>
              <p class="panel-sub" id="grocerySub" style="margin-bottom:0">By aisle</p>
            </div>
            <button class="copy-btn" id="copyBtn" disabled>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="9" rx="1.6"/><path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 4 11h1.5"/></svg>
              <span id="copyLabel">Copy list</span>
            </button>
          </div>
          <div id="groceryList"></div>
        </div>

      </div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/recipes-data.js?v=1"></script>
  <script src="js/app.js?v=3"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/orbit.js?v=4"></script>
</body>
</html>

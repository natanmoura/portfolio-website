<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f8" />
  <title>Projects — Natan Moura</title>
  <script>
    // Does the wizard intro play this time? Decided here, before anything
    // is drawn, so a skipped intro never flashes. It plays once per browser
    // session, never in a background tab, on a project link, or with
    // Reduce Motion on. ?intro on the URL forces it. js/intro.js and
    // js/drum.js both go by the no-intro mark this leaves on <html>.
    (function () {
      var ALWAYS_PLAY = false;   // testing switch: true plays it on every load
      var played = false;
      try { played = !!sessionStorage.getItem('introPlayed'); } catch (e) {}
      var force = /[?&]intro\b/.test(location.search);
      var skip = !ALWAYS_PLAY && !force && (played || location.hash || document.hidden ||
        matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (skip) document.documentElement.classList.add('no-intro');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=194" />
  <script src="js/haptics.js?v=1"></script>
  <script src="js/emoji-fluent.js?v=14"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3/dist/mux-player.mjs"></script>
  <link rel="stylesheet" href="css/theme-2-swiss.css?v=9" />
</head>

  <!-- PROJECT GALLERY -->

    <section class="section" id="work" style="padding-top: 8rem;">

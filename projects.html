  <script>
    // The opening, decided here before anything is drawn so nothing
    // flashes. js/drum.js goes by the marks this leaves on <html>.
    //  - drum-spin: the drum spins up to the first row and the greeting
    //    appears. Every fresh visit: the first time Projects shows in a
    //    browser session. Not on a reload, not on a project link, and not
    //    coming back to Projects from another page.
    //  - dock-intro: the dock's buttons are held below the screen and bob
    //    up after the spin. Only when arriving from outside the site, since
    //    moving between pages keeps the dock on screen.
    // Both play with Reduce Motion on, like the rest of the site's motion.
    // ?spin on the URL forces them, for testing.
    (function () {
      var root = document.documentElement;
      var seen = false, fromSite = false;
      try { seen = !!sessionStorage.getItem('drumSeen'); sessionStorage.setItem('drumSeen', '1'); } catch (e) {}
      try { fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      var force = /[?&]spin\b/.test(location.search);
      if ((force || !seen) && !location.hash) {
        root.classList.add('drum-spin');
        if (force || !fromSite) {
          root.classList.add('dock-intro');
          // Never leave the dock hidden if the drum doesn't run.
          setTimeout(function () { root.classList.remove('dock-intro'); }, 5000);
        }
      }
    })();
  </script>

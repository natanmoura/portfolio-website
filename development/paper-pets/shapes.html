<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Pets Shapes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f1ece4; --card: #fbf8f2; --ink: #221d1a; --muted: #7a6e65; --line: #e2d9cc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 "DM Sans", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--muted); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: 130px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
  .head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 0; }
  .name { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 13px; }
  .name b { display: block; font-size: 14px; }
  .name small { color: var(--muted); display: block; margin-top: 4px; line-height: 1.5; }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
  .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  @media (max-width: 720px) { .grid { grid-template-columns: 90px repeat(4, minmax(0, 1fr)); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<h1>Head structures</h1>
<p class="sub">Clay renders of every breed head, front, three-quarter and side, plus the flat net. Fewer faces and folds is easier to build.</p>
<div class="bar"><span>Structure</span><span id="structs"></span></div>
<div class="grid" id="grid"></div>
<script type="module" src="js/shapes.js"></script>
</body>
</html>

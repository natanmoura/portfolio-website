<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Component Editor — Awesome Town</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body class="editor">

<header id="bar">
  <h1>Components<em>Awesome Town</em></h1>
  <nav id="crumbs" class="crumbs"></nav>
  <span id="status" class="status"></span>
  <span class="grow"></span>
  <a class="btn" href="index.html" title="Back to the city builder">← Town</a>
  <button class="btn" id="btn-revert">Revert</button>
  <button class="btn primary" id="btn-save">Save</button>
</header>

<main>
  <aside id="shelf" class="panel"></aside>
  <div id="viewport"></div>
  <aside id="edit" class="panel"></aside>
</main>

<script type="module" src="js/editor.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>City Builder</title>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header id="bar">
  <nav class="apptabs">
    <a class="apptab on" href="index.html">City Builder</a>
    <a class="apptab" href="editor.html">Components</a>
  </nav>
  <span id="scene-name" class="scene-name"></span>
  <span id="status" class="status"></span>
  <span class="grow"></span>
  <button class="btn icon" id="btn-help" title="Keyboard shortcuts">?</button>
</header>

<main>
  <aside id="controls" class="panel">
    <div id="controls-body"></div>
  </aside>
  <div id="viewport">
    <div id="layers"></div>
    <div id="stats" class="on"></div>
  </div>
  <aside id="inspector" class="panel empty"></aside>
</main>

<div id="loading">
  <div class="load-inner">
    <h2>Awesome Town</h2>
    <p>Loading the image pool</p>
    <div class="bar"><span></span></div>
    <p class="count">0 / 0</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>

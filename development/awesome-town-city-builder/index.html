<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>City Builder</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!--
  One document, two views.

  They were two pages, and crossing between them threw away the image pool,
  the component library and every rendered thumbnail, then spent a second and
  a half building them again. It is one editing session: you lock a parameter
  on a component to see what it does to the town, and look back. Nothing about
  that is two documents.

  The tabs switch which view is mounted, and everything expensive lives in the
  shell above both of them.
-->
<header id="bar">
  <nav class="apptabs">
    <button class="apptab on" data-view="city" type="button">City Builder</button>
    <button class="apptab" data-view="components" type="button">Components</button>
  </nav>
  <span id="status" class="status"></span>
  <span class="grow"></span>
  <!-- Each view's own controls. Only the mounted one is shown, because a
       Save button belonging to a panel you cannot see is worse than absent. -->
  <span class="bar-tools" data-view="city">
    <button class="btn icon" id="btn-help" title="Keyboard shortcuts">?</button>
  </span>
  <span class="bar-tools" data-view="components" hidden>
    <button class="btn" id="btn-revert">Revert</button>
    <button class="btn primary" id="btn-save">Save</button>
  </span>
</header>

<main id="view-city">
  <aside id="controls" class="panel">
    <div id="controls-body"></div>
  </aside>
  <div id="viewport" class="view">
    <div id="layers"></div>
    <div id="stats" class="stats on"></div>
  </div>
  <aside id="inspector" class="panel empty"></aside>
</main>

<main id="view-components" class="editor" hidden>
  <aside id="shelf" class="panel"></aside>
  <div id="ed-viewport" class="view">
    <div id="ed-stats" class="stats on"></div>
  </div>
  <aside id="edit" class="panel">
    <div id="crumbs" class="crumbs"></div>
    <div id="edit-body"></div>
  </aside>
</main>

<div id="loading">
  <div class="load-inner">
    <h2>Loading the image pool</h2>
    <div class="bar"><span></span></div>
    <p class="count">0 / 0</p>
  </div>
</div>

<script type="module" src="js/shell.js"></script>
</body>
</html>

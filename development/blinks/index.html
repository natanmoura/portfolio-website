<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Blinks</title>
<script>
  // Every file here is linked relatively, so the address needs its trailing
  // slash. Without it, natanmoura.com/development/blinks would look for its
  // styles and scripts one folder up.
  if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
    location.replace(location.pathname + '/' + location.search + location.hash);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>


<aside id="dials" hidden>
  <button id="dials-toggle" aria-expanded="false">Look</button>
  <div id="dials-body"></div>
</aside>
<div id="help-tip" role="tooltip"></div>

<div id="hint" aria-label="Meet the Blinks. They only live one minute... Drag them together to grow new ones!"></div>

<div id="over">
  <div class="card">
    <h2>Everyone's gone</h2>
    <p id="over-text"></p>
    <button id="again">Start a new garden</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
